<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname + window.location.search;
        if (window.location.hash) {
          window.sessionStorage.setItem("spa-redirect-hash", window.location.hash);
        }
        window.sessionStorage.setItem("spa-redirect", path);
        window.location.replace("/");
      })();
    </script>
  </head>
  <body></body>
</html>
